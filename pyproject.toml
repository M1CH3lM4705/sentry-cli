[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentry-cli"
version = "0.1.1"
description = "Autonomous Debian Homelab Operations & Diagnostics CLI via Local LLM (Ollama)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Michel Matos", email = "michel.mef@gmail.com" }
]
keywords = ["homelab", "debian", "ollama", "cli", "ai", "operations", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
sentry = "sentry_cli.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sentry_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
